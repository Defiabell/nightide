<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>夜潮 Nightide</title>
    <link rel="icon" href="data:," />
    <style>
      /* Mobile web (响应式适配): fill the viewport and clip; `#app` is center-pinned and scaled to
         fit by `responsiveScale.ts` (transform set at runtime). The whole desktop layout (board +
         right HUD) shrinks to fit any screen rather than reflowing — 宽横板 28×15 在竖屏会很小，
         所以 landscape 体验最佳（见 #rotate-hint 提示）。 */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: #06070f; color: #cfd4ea; font-family: system-ui, sans-serif; }
      /* position:fixed + translate-center means CSS `scale()` on #app stays visually centered
         regardless of its (un-scaled) layout box, so no scrollbars/overflow from the transform. */
      #app { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); transform-origin: center center; display: flex; gap: 16px; align-items: flex-start; }
      /* 竖屏时的非阻挡提示（pointer-events:none，游戏在其下照常可玩），横屏自动消失。 */
      #rotate-hint { display: none; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint { display: block; position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 2000; pointer-events: none; font-size: 12px; color: #ffcf6e; background: rgba(23, 18, 58, 0.9); border: 1px solid #4a3a7a; border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
      }
      /* 回放 UI 栏 (Task 6, docs/plans/nightide/2026-08-10-replay-share-design.md): 暂停/倍速/退出
         三控件 + tick 进度文案, 动态创建（`replayBar.ts`'s `mountReplayBar`）——不在这份静态 HTML
         里出现, 同 `#nightide-history-panel`/`#draft-modal-overlay` 等其它 JS-建的 overlay 一样,
         这里只定义样式。挂到 `document.body`（不是 `#app`——`#app` 是横向 `display: flex` 两栏
         布局〔战斗列 + `#hud`〕, 塞一条横 bar 进去只会被当成第三个 flex item 挤在旁边, 不会铺满
         顶部）, 靠 `position: fixed; top: 0` 视觉上"钉在 `#app` 顶部", 同 `#nightide-mode-select`/
         `#rotate-hint` 这类既有 overlay 一样用 viewport 定位而不是 DOM 父子关系去够到"#app 顶部"
         这个视觉位置。z-index 14: 介于 `.building-panel`(12) 和 `.tide-banner`(15) 之间——比普通
         对局内容高, 仍低于任何真正的模态（暂停 16／投降 20／战史 30／新手卡 890／抽卡 900／模式
         选择与提示 1000+）——回放栏是常驻工具条不是模态, 不该挡住其它需要用户回应的弹层。 */
      /* fix (Task 8 复审第二轮 Important 2, 移动端溢出): 原来这里没有 `flex-wrap`/`max-width`——
         暂停/倍速/进度/复制/退出五个短元素单行永远够放（桌面 1200px 也没问题），但复审在 360×640
         实测：`copyTextBestEffort` 两条剪贴板路径都失败后追加的兜底整行（说明文字 + URL 输入框，
         见下面 `.replay-bar-copy-fallback-row`）会把这条 `position: fixed` 的横条撑到 608px 宽，
         右边缘越界约 109px——`fixed` 元素没有可滚动的 overflow，用户完全够不到超出屏幕的那部分 URL。
         `flex-wrap: wrap` 让撑不下的内容换行而不是把整条横条撑宽，`max-width: 100vw` 是双重保险
         （即使某个未来加的子项自己声明了超宽的固定宽度，横条本身也不会比视口更宽）。 */
      .replay-bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 14; display: flex; flex-wrap: wrap; max-width: 100vw; align-items: center; gap: 10px; padding: 8px 14px; background: #17123a; border: 1px solid #4a3a7a; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); }
      /* fix (同 `#hud .gold-row`/`.units-row`/`.soul-energy-row` 的"HUD 数字抖动"教训): tick 会随
         播放持续增长（137 -> 1370 -> 13700……），数字变宽本身没问题, 但没有 `nowrap` 会在恰好变宽
         的那一刻把整条回放栏挤到第二行——`nowrap` 让它宁可裁切也不换行/不重排。 */
      .replay-bar-progress { font-size: 13px; color: #9aa3c9; letter-spacing: 0.5px; white-space: nowrap; }
      /* 暂停：跟 `#topbar .pause-btn` 同一蓝色家族, `.active`（暂停中）复用它"高亮=偏离基线"的惯例。 */
      .replay-bar-pause { padding: 8px; background: #16223a; color: #9fd3ff; border: 1px solid #345a82; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      .replay-bar-pause:hover { background: #1e2f4d; }
      .replay-bar-pause.active { background: #2a4a6e; color: #fff; border-color: #6ab3ff; }
      /* 倍速：跟 `#topbar .speed-btn` 同一琥珀家族, `.active`（当前非默认 2x）同样复用惯例。 */
      .replay-bar-speed { padding: 8px; background: #2a2410; color: #ffdb8a; border: 1px solid #7a6224; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; font-weight: 600; min-width: 34px; }
      .replay-bar-speed:hover { background: #3a3216; }
      .replay-bar-speed.active { background: #4a3c14; color: #fff; border-color: #d8b84a; }
      /* 退出：跟 `#topbar .surrender-btn` 同一红色「离开/终止」家族。 */
      .replay-bar-exit { padding: 8px; background: #3a1a1a; color: #ffb3b3; border: 1px solid #7a3a3a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      .replay-bar-exit:hover { background: #4a2222; }
      /* Task 8（回放分享——裁决：回放栏必须自带一个「复制链接」按钮，见 replayBar.ts
         `ReplayBarHandle` 的 doc comment）: 地址栏在移动端/itch.io iframe/CrazyGames 嵌入页里都
         不可见，这颗按钮是那三个渠道唯一的分享出口。复用 `#topbar .history-btn` 同一紫色「菜单
         动作」家族——跟暂停(蓝)/倍速(琥珀)/退出(红) 三个既有控件的色相都不撞，读作"第四种、不同
         类别的动作"。stale 之后也不移除（见 `showStale()` 自己的 doc comment），故没有单独的
         disabled 视觉需要在这里定义。 */
      .replay-bar-copy { padding: 8px; background: #201a3a; color: #cdadff; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      .replay-bar-copy:hover { background: #2a2248; }
      /* Task 8 复审 Important 1+2: `writeText`/`execCommand` 都失败时（跨域 iframe 缺 clipboard
         权限委托的极端情况）揭开的兜底——一句 `replay_copy_failed` 说明 + 一个只读输入框；懒创建/
         懒显示，见 `replayBar.ts`/`sharePanel.ts` 各自的 doc comment。
         这个规则故意**不**挂在 `.replay-bar` 底下当子元素——两轮实测都栽在同一个坑里："把一段需要
         固定尺寸的内容塞进一个自动宽度、又允许换行的 flex 容器"：容器自身宽度是从"每个子项能收缩多
         窄"反推出来的，无论给这一行加 `flex-basis: 100%` 还是具体像素的 `flex-basis: 280px`，只要
         没有同时锁死 `flex-shrink`, 反推算法都会先把它（以及它的子项）压到最小内容宽度再去定容器
         宽度，实测两次都落回 ~150px/~55px 的挤压结果。真正的修复是让这一行完全跳出 `.replay-bar`
         的 flex 布局——独立挂到 `document.body` 上、自己的 `position: fixed`，宽度用
         `min(320px, 92vw)` 这类纯粹基于视口的表达式，不受任何父容器的自动宽度反推影响。
         钉在视口**底部**（`bottom`，不是 `top` 加一个猜测的偏移量）是有意的：`.replay-bar` 自己在
         窄屏下会因为 `flex-wrap: wrap` 而变成好几行（暂停/倍速/进度/复制/退出各占一行），渲染高度
         因此是个随屏宽变化、这里没法静态得知的数字——第一版试过 `top: 52px`（假设 bar 只有一行的
         高度），实测在 360px 宽下 `.replay-bar` 实际渲染到 163px 高，这一行直接叠在了 bar 的中间。
         钉底部彻底绕开"要不要知道另一个元素的实际高度"这个问题——回放栏在顶部，这一行在底部，两者
         无论各自多高都不会互相覆盖。`replayBar.ts` 的 `destroy()` 也要显式移除这个节点（它不是
         `.replay-bar` 的子节点，`el.remove()` 够不到它，见该方法自己的 doc comment）。 */
      .replay-bar-copy-fallback-row { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 14; width: min(320px, 92vw); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); }
      /* 故意不给 `flex-shrink: 0`（跟 `.share-panel-replay-fallback-note` 保持同一条"允许收缩/换行"
         规则一致）——这句英文说明单行就有 58 个字符，锁死 `flex-shrink: 0` 会让它坚持要一整行的
         宽度，把输入框挤出这一行的可视范围之外（实测踩过：input 被推到 x=357，宽度只剩 18px，
         整个跑出了自己所在这一行的盒子）。允许收缩，文字在窄行里正常换行成两三行，输入框才有机会
         分到一份看得见、能操作的宽度。 */
      .replay-bar-copy-fallback-note { font-size: 12px; color: #ffab8a; }
      .replay-bar-copy-fallback, #nightide-share-panel .share-panel-replay-fallback { flex: 1 1 140px; min-width: 0; padding: 6px 8px; background: #0f0c1f; color: #cfd4ea; border: 1px solid #4a3a7a; border-radius: 6px; font-size: 12px; box-sizing: border-box; }
      /* 结算面板同款兜底行——跟回放栏那份不同，这里没有"自动宽度父容器"的坑：`#nightide-share-panel
         .share-panel-box` 是 `flex-direction: column`，直接子元素天生占满整个盒子自己的宽度（那个
         宽度由图片/按钮行等其它内容撑起来，不是靠这一行自己反推），所以维持简单的行内 flex 布局即可
         （`flex-wrap: wrap` 只是给极端窄屏一个安全网，正常宽度下说明文字和输入框本就在一行）。 */
      #nightide-share-panel .share-panel-replay-fallback-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #nightide-share-panel .share-panel-replay-fallback-note { font-size: 12px; color: #ffab8a; }
      /* `showStale()`：整条栏换成的提示文案, 读作"警告", 用跟 `.topbar-difficulty.tier-hard` 同一
         橙红色而不是 `.replay-bar-exit` 的深红底——这不是一个"离开"按钮, 是纯文字通知, 不该长成
         按钮的样子（`showStale()` 之后这条栏已经不再有任何控件, 见 `replayBar.ts` 的 doc comment）。 */
      .replay-bar-stale { font-size: 13px; color: #ffab8a; text-align: center; }
      /* 全分支复审 Fix 3 —— `showFinished()`：回放正常播完后替代暂停/倍速的那条文案。与
         `.replay-bar-stale` 同样是纯文字通知（同样不长成按钮的样子），但**故意不同色**：播完是正常
         结局，用 `.replay-bar-progress` 那条中性的灰蓝，而不是 stale 的橙红警告色——两条文案出现的
         时机互斥（播完 / 判定失真），颜色是观众区分"这局看完了"与"这局不可信"的第一信号。 */
      .replay-bar-finished { font-size: 13px; color: #9aa3c9; text-align: center; }
      /* Task 6（防守模式客户端接线）: opening mode-select overlay (see src/modeSelect.ts). Attached
         directly to <body> — a SIBLING of #app, not a descendant — so `#app`'s responsive
         `transform: scale(...)` (responsiveScale.ts) never affects it, and this rule never touches
         any #app layout. `position: fixed; inset: 0` covers the full viewport like every other
         page-level overlay (`#nightide-history-panel` etc.); `display: none` by default so a page
         load doesn't flash it before `showModeSelectOverlay()` adds `.show`. */
      #nightide-mode-select { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 7, 15, 0.85); z-index: 1000; }
      #nightide-mode-select.show { display: flex; }
      #nightide-mode-select .mode-select-box { display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 10px; padding: 26px 32px; min-width: 240px; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55); }
      #nightide-mode-select .mode-select-title { font-size: 22px; font-weight: 800; color: #ffcf6e; text-align: center; letter-spacing: 2px; }
      #nightide-mode-select .mode-select-subtitle { font-size: 13px; color: #9aa3c9; text-align: center; margin-bottom: 6px; }
      #nightide-mode-select .mode-select-btn { padding: 12px; background: #241a3a; color: #cfd4ea; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
      #nightide-mode-select .mode-select-btn:hover { background: #2e2350; }
      #nightide-mode-select .mode-select-defense { color: #ffb3b3; border-color: #7a3a3a; }
      /* Task 3 (fog-mode 模式入口): third button — misty blue-grey (vs. defense's alarm-red), no
         functional difference from the base .mode-select-btn rule above, purely a visual peer of
         `.mode-select-defense`'s own color override so the third choice doesn't look unstyled. */
      #nightide-mode-select .mode-select-fog { color: #b9d6ff; border-color: #3a5a7a; }
      /* 阶段 2（玩家选阵营 + 敌方阵营随机, docs/plans/nightide/2026-08-14-faction-select-design.md
         §四）: replaces Task 8's单一「亡灵挑战」button (which never got its own color override,
         just the base .mode-select-btn styling) — two peer buttons, one per non-default roster,
         each with its own accent color mirroring the defense/fog pattern above (purple = bone/
         undead, green = thorn/beast). */
      #nightide-mode-select .mode-select-roster-undead { color: #c9b3ff; border-color: #5a3a7a; }
      #nightide-mode-select .mode-select-roster-witch { color: #b3ffc9; border-color: #3a7a4a; }
      /* Task 8（回放分享——boot 入口, main.ts）: 打开一条 `#r=` payload 已损坏/不合法的回放链接时，
         alert-free 地在模式选择遮罩里插一行提示——复用 `.replay-bar-stale` 同一橙红色"这里出了点
         问题"配色，而不是原生 `alert()` 或另起一套弹层视觉。 */
      #nightide-mode-select .mode-select-error { font-size: 13px; color: #ffab8a; text-align: center; margin-bottom: 4px; }
      /* 战报分享卡预览浮层（Task 2, src/share/sharePanel.ts；Task 3 升级为「结算面板」自动弹出）：
         与 #nightide-mode-select 完全同款的「挂 body + fixed inset:0 遮罩 + display:none 直到
         .show」惯例，避免加载时闪现。 */
      #nightide-share-panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 7, 15, 0.85); z-index: 1000; }
      #nightide-share-panel.show { display: flex; }
      /* fix (Task 8 复审第二轮, 同 Important 2 一类问题的竖向版本): `max-height: 92vh` 本来就在
         这里, 但没配 `overflow-y`——图片+headline+actions 行已经能在矮屏（实测 360×640）下逼近
         92vh, 追加的兜底行（说明文字+URL 输入框）会直接把输入框整段推到视口外面。这层遮罩
         (`#nightide-share-panel`) 是 `align-items: center` 把这个盒子纵向居中, 盒子自身既不滚动
         也没有更外层的滚动容器兜底——`overflow-y: auto` 让盒子在真的顶到 92vh 上限时能在自己内部
         滚动, 而不是让底部内容永久不可见（同 `.replay-bar` 那次修复解决的是同一类"够不到内容"
         问题，只是这次是纵向溢出、不是横向撑宽）。 */
      #nightide-share-panel .share-panel-box { display: flex; flex-direction: column; align-items: stretch; gap: 12px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 10px; padding: 20px; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55); max-height: 92vh; overflow-y: auto; }
      /* Task 3: headline 行——结果大字（用海报同款金/蓝配色区分胜负）+ 副标题（用时等），置于
         卡面上方，让自动弹出时结果一眼可见，不必等眼睛扫到卡面本身。 */
      #nightide-share-panel .share-panel-headline { text-align: center; }
      #nightide-share-panel .share-panel-headline-title { font-size: 26px; font-weight: 700; color: #ffd76e; }
      #nightide-share-panel .share-panel-headline-title--lose { color: #8fa3c8; }
      #nightide-share-panel .share-panel-headline-subtitle { font-size: 13px; color: #9aa3c9; margin-top: 2px; }
      /* 卡面原生 750x1000——按视口高度等比缩放，宽度跟着走，避免小屏幕下溢出遮罩。 */
      #nightide-share-panel .share-panel-img { display: block; max-width: min(78vw, 480px); max-height: 70vh; width: auto; height: auto; border-radius: 8px; align-self: center; }
      #nightide-share-panel .share-panel-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      #nightide-share-panel .share-panel-btn { padding: 10px 18px; background: #241a3a; color: #cfd4ea; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
      #nightide-share-panel .share-panel-btn:hover { background: #2e2350; }
      #nightide-share-panel .share-panel-close { color: #ffb3b3; border-color: #7a3a3a; }
      /* Task 3: 「再来一局」——同 hud.ts 里 .rematch-btn 一样用金色强调，是面板里最鼓励点的动作。 */
      #nightide-share-panel .share-panel-rematch { color: #ffd76e; border-color: #7a6a2a; }
      /* Task 8（回放分享入口）: 「复制回放链接」——金色留给 rematch 自己（面板里最鼓励点的动作），
         这里换一个同一"鼓励点击"梯队但不同色相的紫，跟 `.share-panel-rematch` 不抢视觉重点，同时
         跟回放栏自己的 `.replay-bar-copy`（同一紫色家族）读作"同一个功能的两处入口"。disabled 态
         （payload 超长）复用 `#hud button:disabled` 的透明度惯例。 */
      #nightide-share-panel .share-panel-replay { color: #b9a0ff; border-color: #5a4a8a; }
      #nightide-share-panel .share-panel-replay:disabled { opacity: 0.35; cursor: default; }
      /* disabled 态的解释文案（`replay_too_long`）——静音灰，同 `.mode-select-subtitle` 同一"说明性
         文字"梯队，不是警示色：这不是"出错了"，只是"这局太长，分享不了"。 */
      #nightide-share-panel .share-panel-replay-note { font-size: 12px; color: #9aa3c9; text-align: center; }
      /* HUD redesign — two-zone layout (direct user feedback: "菜单和一些信息能不能放在游戏上方，
         所有的选项都放在右侧有点长，而且不好辨认"): `#battle-column` stacks the new `#topbar`
         (glanceable read-only status + the ☰ 菜单 button) directly above `#game`, so the two share
         the same column and the top bar's width can be pinned to the canvas's own pixel width
         (`main.ts` sets `#topbar`'s inline width to `board.cols * CELL`, the same figure it already
         computes for the Phaser `Game`'s own width — see `layout.ts`'s `boardPixelSize`). `#hud`
         (the right column) keeps only the INTERACTIVE controls (cards/abilities/拆除/阵型/设集结点/
         draft) — see hud.ts's constructor doc comment for the full split. */
      #battle-column { display: flex; flex-direction: column; gap: 10px; }
      #game { position: relative; }
      /* Glanceable status strip: gold/兵力/灯辉/等级/剩余时间 + the ☰ 菜单 button, horizontal so
         each readout gets its own labeled slot instead of stacking into one hard-to-scan column.
         `position: relative` is the containing block for `.menu-dropdown`'s absolute placement
         below (opening the dropdown must not reflow/widen the bar). */
      /* `box-sizing: border-box` is load-bearing here: `main.ts` sets this element's inline
         `width` to the canvas's exact pixel width (`boardPixelSize`) so the bar spans the board
         edge-to-edge — with the default `content-box`, that width would exclude this rule's own
         padding/border and the bar would overhang the canvas on both sides. */
      /* HUD redesign v2: two stacked rows — row 1「整体」(buttons + difficulty + 天梯 + timer),
         row 2「战局」(你 vs 对手 live stats). Column layout; each `.topbar-row` is its own flex row. */
      #topbar { box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 16px; background: #12101f; border: 1px solid #4a3a7a; border-radius: 8px; }
      #topbar .topbar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      /* Row 1 sits above a hairline divider so the「整体」frame reads as distinct from the「战局」
         stats below it. `position: relative` so the ☰ `menu-dropdown` (a child of row 1) anchors its
         `top: 100%` to row 1 alone, opening right under the ☰ button rather than below both rows. */
      /* Row 2「战局」moved into #hud (user feedback: 与右侧战斗选项放一起便于看对局), so #topbar is now a
         single row — drop the row-1/row-2 divider (padding-bottom/border-bottom), but KEEP
         position:relative: it's the containing block the ☰ menu-dropdown anchors its `top:100%` to. */
      #topbar .topbar-row-meta { position: relative; }
      /* The five status readouts share one flex group so the vertical divider rule below can target
         them without also drawing a line next to the ☰ 菜单 button (a different visual family). */
      /* Row 2「战局」: inherits display:flex/align/wrap from `.topbar-row`; only overrides gap to 0
         because its `> div` children draw their own border-left dividers instead of using gap. */
      /* Task (the lantern menu) requirement 3: safety net for short viewports — #hud itself
         doesn't need this on a normal-height window (the menu collapsing the four old buttons
         into one is the primary space fix), but if content still exceeds the viewport this lets
         the panel scroll internally instead of overflowing the page. Thin, dark-theme-toned
         scrollbar (both the standard and WebKit-specific properties, for cross-browser coverage). */
      /* max-height:100vh 只是无 JS 时的兜底——responsiveScale.ts 的 fitAppToViewport 会把它改写成
         `vh / scale`（缩放坐标系下的满屏高），否则 transform 缩放后 hud 视觉高只剩 100vh×scale，
         手机横屏下"菜单很短、下方被遮盖"。overscroll-behavior 防手机上滚 hud 穿透到页面。 */
      /* fix (user report, HUD 数字抖动): `#hud`'s width was a bare 200px, sized for the SHORT
         early-match "你 60 ｜ 对手 60" gold/兵力 stat lines only. As either side's gold climbs past
         3 digits (goldCap in `createSandboxConfig` is 9999 — a routinely reachable, sustained
         state in a long match, not just a rare edge case — see `@nightide/content`'s
         `goldCap: 9999 * FP`), `.gold-row`'s text (`white-space: normal` by default) wrapped onto a
         second line the instant it no longer fit the ~182px content width this left the stat rows,
         growing `.hud-stats`' height and shoving `.cards-row`/every button below it down a line —
         then back up the moment gold dropped back under the wrap threshold (e.g. spending on a
         card). That up/down shove IS the reported jitter, verified with a Chromium DOM harness
         (`.gold-row`'s own `getBoundingClientRect().height` flipping 16px -> 32px exactly at the
         4th digit, both zh and en). Width, not character spacing, was confirmed as the firing
         mechanism (a `tabular-nums` fix wouldn't touch a WRAPPING bug), so widening is the direct
         countermeasure. 200 -> 240px is sized off actually-reachable text, not a guess: the widest
         REALISTIC line is EN's `Gold — You 9999 | Opponent 9999` (goldCap, sustained) plus a small
         margin for `SimConfig.goldCap`'s documented one-tick post-cap overshoot from a same-tick
         kill bounty/harvest credit (`types.ts`'s `goldCap` doc comment) — both measured to fit
         comfortably inside 240px's ~222px content width with zero clipping, vs. today's ~182px
         which clips (not just wraps) that same line by over 30px. This does widen every OTHER row
         in `#hud` by the same 40px too (cards grid / buttons / stance row) — unavoidable, since
         `#hud`'s own `overflow-y: auto` clips (not just scrolls) any child that's wider than `#hud`
         ITSELF, confirmed by a harness that widened only `.hud-stats` and watched the overflow get
         silently clipped at `#hud`'s old 200px edge rather than bleeding visibly past it — so the
         fix has to land on the shared container, not a scoped child rule. `responsiveScale.ts`'s
         `fitAppToViewport` measures `#app.offsetWidth` live every fit, so this is zero-risk there
         (no hardcoded width anywhere in that path — see its own file header). */
      #hud { width: 240px; display: flex; flex-direction: column; gap: 10px; max-height: 100vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #4a3a7a #12101f; }
      #hud::-webkit-scrollbar { width: 6px; }
      #hud::-webkit-scrollbar-track { background: #12101f; }
      #hud::-webkit-scrollbar-thumb { background: #4a3a7a; border-radius: 3px; }
      #hud .banner { font-size: 15px; font-weight: 600; line-height: 1.5; padding: 8px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 6px; text-align: center; }
      #hud .memory-row { font-size: 12px; line-height: 1.6; padding: 6px 8px; background: #1a1030; border: 1px solid #4a3a7a; border-radius: 6px; text-align: center; color: #cdadff; }
      #hud .memory-row .archetype-reveal { color: #9aa3c9; font-size: 11px; margin-top: 2px; }
      /* L1 每日速通挑战: match-end result line, same dark-card family as .memory-row — shown only
         on a winning challenge attempt (see Hud.showChallengeResult). */
      #hud .challenge-result-row { font-size: 13px; font-weight: 600; padding: 6px 8px; background: #1a1030; border: 1px solid #4a7a34; border-radius: 6px; text-align: center; color: #b9e8a0; }
      /* HUD redesign: 剩余时间 stays in `#topbar` (整体/框架 clock). The 战局 stats
         (gold/材料/兵力/等级进度) moved into `#hud` (user feedback: 与右侧战斗选项放一起便于看对局),
         so these four are UNSCOPED (no `#topbar` prefix) to keep their color/size in their new #hud
         home. `.hud-stats` (below) is their new container. */
      /* fix (user report, HUD 数字抖动): `nowrap` is the belt to `#hud`'s 240px suspenders above —
         240px is sized for the routinely-reachable sustained max (goldCap 9999) plus a small
         margin, but the sim's own doc comment (`types.ts`'s `goldCap`) allows a further one-tick
         post-cap overshoot from a same-tick bounty/harvest credit; `nowrap` guarantees that even an
         unaccounted-for overshoot clips cleanly on ONE line (no visible reflow) rather than wrapping
         to a second line and reproducing the exact jitter this fix removes. */
      #hud .gold-row { font-size: 13px; color: #d8a03c; white-space: nowrap; }
      /* 多资源经济 R6 (client material readouts, docs/plans/nightide/2026-07-22-multi-resource-
         economy-plan.md §6): YOUR wood/ore only — see `materialsRow`'s own doc comment in hud.ts.
         Wood-green/ore-slate tones, matching `effects.ts`'s existing `harvested` fx float-text
         colors (0x9ecb7e / 0xbfc7d6) so the readout and the harvest fx read as the same resource. */
      #hud .materials-row { font-size: 13px; }
      #hud .materials-row .material-wood { color: #9ecb7e; }
      #hud .materials-row .material-ore { color: #bfc7d6; }
      /* V4f-3 (frontier client): unit-count/cap readout — same tier as .gold-row, distinct hue so
         it doesn't read as "more gold info". `.at-cap` flags when the LOCAL player has hit
         maxUnitsPerFaction (production silently paused) — warm/red like the building panel's own
         拆除 button palette below, so it reads as "attention", not just informational. */
      /* fix (user report, HUD 数字抖动): same `nowrap` safety net as `.gold-row` right above — the
         army-count line sits in the same `.hud-stats` panel and reflows on exactly the same
         mechanism, even though its own cap (`maxUnitsPerFaction`, e.g. 60) makes it wrap in
         practice far less often than gold. */
      #hud .units-row { font-size: 13px; color: #9fd3ff; white-space: nowrap; }
      #hud .units-row.at-cap { color: #ff8a8a; font-weight: 600; }
      /* FINAL REVIEW F5 (whole-branch review, docs/plans/nightide/2026-08-07-undead-v2-pure-soul-
         *): the undead's own resource-row switch (`hud.ts`'s `soulEnergyRow`, shown in place of
         `.gold-row` only for the local undead player) had no rule here at all — same tier/`nowrap`
         treatment as `.gold-row`/`.units-row` right above, but its own hue (#b18cff) matching
         `effects.ts`'s soul-refund float-text tint (0xb18cff) so the HUD row and that float text
         read as the same resource.

         User report (魂能的位置太不起眼了，最起码要跟之前金币的位置一样才对 —
         soul-row-prominence): at the SAME 13px/#b18cff tier as `.gold-row`, this row still read
         as a minor status chip next to gold, because for an undead player it's the ONLY row in
         `.hud-stats` that IS a spendable-resource readout (materials/gold are hidden — see
         `soulEnergyRow`'s doc comment in hud.ts) — it deserves to visually lead the panel the way
         `.gold-row` leads it for every other faction, not just tie its font-size. Bumped to 15px/
         700-weight (bigger and heavier than every other `.hud-stats` row, `.gold-row` included)
         and lightened/saturated within the SAME violet family (#b18cff -> #c9a8ff) rather than
         switching hues, keeping the soul-row/soul-refund-float-text color kinship the original
         comment establishes while reading brighter against the `#12101f` panel than gold's
         `#d8a03c` does (`#c9a8ff`'s naive per-channel luminance ≈181 vs gold's ≈165 — see this
         file's own header comment for why this repo tracks such numbers instead of eyeballing
         contrast). `nowrap` is UNCHANGED — still the belt to `#hud`'s 240px suspenders (see the
         `.gold-row` comment above for the reflow bug this guards); a bigger/bolder font makes the
         line wider, not taller, so it does not touch `.hud-stats`'s height and cannot reproduce
         that bug. Deliberately still ≤ `.banner`'s 15px/600-weight (the match-result banner is a
         RARE, whole-panel-width event; this row is a routine corner of `.hud-stats`) and nowhere
         near `.lamplight-fill`'s glow treatment, so neither reads as competing for "loudest thing
         in the HUD". */
      #hud .soul-energy-row { font-size: 15px; font-weight: 700; color: #c9a8ff; white-space: nowrap; }
      /* 亡灵 v3「附身」review ruling (C2 fix follow-up): running match-tally readout, right beside
         `.soul-energy-row` under the same local-undead gate (see `hud.ts`'s `possessCountRow` doc
         comment) — same 13px/`nowrap` tier as `.gold-row`/`.units-row` (a secondary stat, not the
         primary resource), colored the exact magenta/crimson `effects.ts`'s `soulSteal` fx already
         uses for a possess's on-map cue, so the tally and its on-map cue read as kin. */
      #hud .possess-count-row { font-size: 13px; color: #ff2e88; white-space: nowrap; }
      #hud .progress-row { font-size: 12px; color: #9aa3c9; letter-spacing: 1px; }
      #topbar .timer-row { font-size: 12px; color: #9aa3c9; letter-spacing: 0.5px; }
      /* 战局 stat panel in #hud — the four rows stacked vertically (the 200px column can't lay them
         out horizontally like the old topbar strip did), boxed like #hud's other panels so it reads
         as one glanceable "对局情况" block sitting above the combat controls. */
      #hud .hud-stats { display: flex; flex-direction: column; gap: 4px; padding: 8px; background: #12101f; border: 1px solid #4a3a7a; border-radius: 6px; }
      #hud .cards-row { display: flex; flex-direction: column; gap: 8px; }
      /* 卡牌分类 (user feedback: 工厂建筑按类型分类): the card bar groups its building cards into
         建设类/兵工厂类/防御军事类 sections, each a small muted header above its own button column.
         An empty section (no owned cards of that category yet) is hidden by hud.ts. */
      #hud .card-cat { display: flex; flex-direction: column; gap: 6px; }
      #hud .card-cat-header { font-size: 11px; color: #7c86ad; letter-spacing: 1px; margin-top: 2px; }
      #hud .card-cat-body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      /* HUD 改版第二节：卡牌网格图标按钮 —— 12 张卡从 12 整行压到 4 行网格，后期右列一屏放下。 */
      #hud .card-icon-btn { position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; padding: 2px; background: #1a1633; border: 1px solid #4a3a7a; border-radius: 6px; }
      #hud .card-icon-btn .card-icon-img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
      #hud .card-icon-btn.unaffordable .card-cost-badge { color: #ff8a8a; }
      #hud .card-icon-btn.selected { border-color: #ffd76e; box-shadow: 0 0 6px rgba(255, 215, 110, 0.5); }
      #hud .card-cost-badge { position: absolute; right: 2px; bottom: 1px; font-size: 10px; color: #e8d9a0; text-shadow: 0 0 3px #000; pointer-events: none; }
      #hud .card-tier-badge { position: absolute; left: 2px; top: 1px; font-size: 9px; color: #9fd3ff; pointer-events: none; }
      /* 能力角标（用户反馈：一眼标出对空/范围攻击）——「空」右上蓝、「爆」左下橙；tier 左上、cost 右下，四角不打架 */
      #hud .card-air-badge { position: absolute; right: 2px; top: 1px; font-size: 9px; font-weight: 700; color: #7ec8ff; text-shadow: 0 0 3px #000; pointer-events: none; }
      #hud .card-splash-badge { position: absolute; left: 2px; bottom: 1px; font-size: 9px; font-weight: 700; color: #ffb35c; text-shadow: 0 0 3px #000; pointer-events: none; }
      #hud .card-icon-fallback { font-size: 12px; color: #cfd4ea; }
      #hud button { padding: 8px; background: #141a33; color: #cfd4ea; border: 1px solid #2a3155; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
      #hud button:disabled { opacity: 0.35; cursor: default; }
      #hud button.selected { border-color: #d8a03c; color: #d8a03c; }
      #hud button.shake { animation: card-shake 0.3s ease-in-out; }
      #hud .rematch-btn { font-size: 15px; font-weight: 600; text-align: center; padding: 10px; background: #3a2a6a; color: #e8dcff; border: 1px solid #7a5ad8; border-radius: 6px; cursor: pointer; }
      #hud .rematch-btn:hover { background: #4a3585; }
      #hud .toast { color: #ffcf6e; font-size: 12px; background: #241a3a; border: 1px solid #4a3a7a; border-radius: 4px; padding: 4px 8px; align-self: flex-start; animation: toast-float 1.4s ease-out forwards; }
      #hud .toast.tide-toast { color: #ff8a8a; background: #2a1414; border-color: #7a3a3a; }
      /* 多资源经济 R6 (client building panel, plan §6): REPLACES the old standalone 「拆除」toggle
         button — an event-driven popup at the top of `#hud`, same dark-card treatment as
         `.building-panel` below. 升级 reuses the warm gold family (`.rally-pick-btn.active`'s
         hue); 拆除 reuses the old `.demolish-btn`'s red family; 取消 is a plain neutral button. */
      /* 建筑面板 UX (user feedback): floats next to the clicked building instead of sitting in the
         right-side #hud column. `position: fixed` positions it against the viewport (no ancestor has
         a persistent transform/filter, and #hud's `overflow-y: auto` does not clip fixed descendants),
         so it stays a child of #hud in the DOM — no re-parenting, no duplicate-across-restart risk —
         while `openBuildingPanel` sets left/top to the building's on-screen coordinates. */
      /* z-index 12: above the game board (#game is z-index:auto) and #hud content, but deliberately
         BELOW every modal overlay — tide banner (15), pause (16), surrender (20), history (30),
         tooltip (1000) — so any of those always covers a still-open building panel instead of the
         panel floating on top of a confirmation dialog. */
      #hud .building-panel { position: fixed; z-index: 12; min-width: 168px; display: flex; flex-direction: column; gap: 6px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 6px; padding: 8px; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); }
      #hud .building-panel-title { font-size: 14px; font-weight: 600; color: #ffcf6e; text-align: center; }
      #hud .building-panel-note { font-size: 12px; color: #9aa3c9; text-align: center; }
      #hud .building-panel-upgrade-btn { padding: 8px; background: #3a2e14; color: #ffcf6e; border: 1px solid #7a5a24; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #hud .building-panel-upgrade-btn:hover { background: #4a3a1c; }
      #hud .building-panel-upgrade-btn:disabled { opacity: 0.35; cursor: default; }
      #hud .building-panel-demolish-btn { padding: 8px; background: #3a1a1a; color: #ffb3b3; border: 1px solid #7a3a3a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #hud .building-panel-demolish-btn:hover { background: #4a2222; }
      #hud .building-panel-demolish-btn:disabled { opacity: 0.35; cursor: default; }
      #hud .building-panel-cancel-btn { padding: 6px; background: #201a3a; color: #9aa3c9; border: 1px solid #3a3a5a; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: center; }
      #hud .building-panel-cancel-btn:hover { background: #2a2248; }
      #topbar .pause-btn { padding: 8px; background: #16223a; color: #9fd3ff; border: 1px solid #345a82; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #topbar .pause-btn:hover { background: #1e2f4d; }
      #topbar .pause-btn.active { background: #2a4a6e; color: #fff; border-color: #6ab3ff; }
      #topbar .pause-btn:disabled { opacity: 0.35; cursor: default; }
      /* 倍速功能 (direct user feedback: "可以设置一个倍速功能，0.8倍速和 2倍速"): sits right beside
         .pause-btn (same first-class topbar family, never menu-housed) — a distinct amber/gold hue
         (matching .topbar-difficulty's badge palette) so it reads as its own control, not a second
         pause button. `.active` (any non-1x speed) echoes `.pause-btn.active`'s "highlight when the
         player deviates from the baseline" convention. No `:disabled` rule — this button is never
         disabled (see hud.ts's `speedBtn` doc comment). */
      #topbar .speed-btn { padding: 8px; background: #2a2410; color: #ffdb8a; border: 1px solid #7a6224; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; font-weight: 600; min-width: 34px; }
      #topbar .speed-btn:hover { background: #3a3216; }
      #topbar .speed-btn.active { background: #4a3c14; color: #fff; border-color: #d8b84a; }
      /* HUD redesign: the ☰ 菜单 button moved from `#hud` into `#topbar` (same horizontal strip as
         the status readouts, per direct user feedback) — same dark-panel family as .history-btn,
         `.active` echoes the dropdown's open state the way `.pause-btn.active`/`.rally-pick-btn.active`
         echo their own toggles. `flex-shrink: 0` keeps it from being squeezed by the stats group
         when the bar wraps on a narrower viewport. */
      #topbar .menu-btn { flex-shrink: 0; padding: 8px 12px; background: #201a3a; color: #cdadff; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; font-weight: 600; letter-spacing: 0.5px; }
      #topbar .menu-btn:hover { background: #2a2248; }
      #topbar .menu-btn.active { background: #2e2350; border-color: #7a5ad8; color: #e8dcff; }
      /* Collapsed by default (JS sets display: none); a small panel once opened, matching
         .building-panel's dark-card treatment so the four re-housed buttons read as one group.
         HUD redesign: now absolutely positioned under the ☰ button (`#topbar` is its containing
         block, set above) instead of flowing inline — opening it must not push the status
         readouts sideways or wrap the bar. `z-index` is an explicit integer (not `auto`) so it
         reliably paints above `#game`, which is also `position: relative` — two z-index:auto
         positioned boxes would otherwise stack by DOM order, and `#game` comes later in the
         document than `#topbar`. */
      #topbar .menu-dropdown { position: absolute; top: calc(100% + 6px); left: 0; z-index: 22; min-width: 190px; flex-direction: column; gap: 8px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 6px; padding: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
      /* M2d Task (重新开始): always-visible reset button, sits right beside 暂停. */
      #topbar .restart-btn { padding: 8px; background: #223016; color: #b9e8a0; border: 1px solid #4a7a34; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #topbar .restart-btn:hover { background: #2b3d1c; }
      /* M2d Task (投降与托管): opens the 3-option surrender dialog. */
      #topbar .surrender-btn { padding: 8px; background: #3a1a1a; color: #ffb3b3; border: 1px solid #7a3a3a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #topbar .surrender-btn:hover { background: #4a2222; }
      #topbar .surrender-btn:disabled { opacity: 0.35; cursor: default; }
      /* M2d Task (战史): opens the match-history overlay panel. */
      #topbar .history-btn { padding: 8px; background: #201a3a; color: #cdadff; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #topbar .history-btn:hover { background: #2a2248; }
      /* M1 云存档：状态行 + 动作按钮，复用 .history-btn 的紫色「菜单动作」家族配色。 */
      #topbar .cloud-status-row { font-size: 12px; color: #9aa3c9; text-align: center; }
      #topbar .cloud-btn { padding: 8px; background: #201a3a; color: #cdadff; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #topbar .cloud-btn:hover { background: #2a2248; }
      /* L1 每日速通挑战 (docs/plans/nightide/2026-07-22-speedrun-leaderboard-design.md §8 L1): 菜单
         内的「每日挑战」面板——标题/日期沿用 .difficulty-label 的静音配色，开始按钮复用 .restart-btn
         的绿色「正向操作」家族，退出按钮复用 .surrender-btn 的红色「离开/终止」家族，读起来分别对应
         「开始一件事」与「结束一件事」。 */
      #topbar .challenge-panel { display: flex; flex-direction: column; gap: 4px; }
      #topbar .challenge-title { color: #cdadff; font-size: 12px; font-weight: 600; }
      #topbar .challenge-date-row { color: #9aa3c9; font-size: 11px; margin-bottom: 2px; }
      #topbar .challenge-start-btn { padding: 6px 8px; background: #223016; color: #b9e8a0; border: 1px solid #4a7a34; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: left; }
      #topbar .challenge-start-btn:hover { background: #2b3d1c; }
      #topbar .challenge-exit-btn { padding: 6px 8px; background: #3a1a1a; color: #ffb3b3; border: 1px solid #7a3a3a; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: center; }
      #topbar .challenge-exit-btn:hover { background: #4a2222; }
      /* B2 (client difficulty UI): the ☰ 菜单's 「难度」row — one compact row, three cycling
         buttons (简单/普通/困难) + a hint that only appears once the selection diverges from the
         running match's own tier ("下一局生效"). HUD redesign: lives inside `.menu-dropdown`,
         which moved from `#hud` into `#topbar` — selector scope follows. */
      #topbar .difficulty-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
      #topbar .difficulty-label { color: #9aa3c9; font-size: 12px; margin-right: 2px; }
      #topbar .difficulty-btn { flex: 1; padding: 5px 4px; font-size: 12px; text-align: center; background: #201a3a; color: #9aa3c9; border: 1px solid #3a3a5a; border-radius: 6px; }
      #topbar .difficulty-btn:hover { background: #2a2248; }
      #topbar .difficulty-btn.active { background: #2e2350; border-color: #7a5ad8; color: #e8dcff; }
      #topbar .difficulty-hint { flex-basis: 100%; display: none; color: #ffd76e; font-size: 11px; text-align: center; }
      /* Difficulty visibility fix: the always-on top-bar badge showing THIS match's tier. Sits
         between the ☰ button and the stats group. Tier-colored so 困难 vs 普通 is glanceable at a
         distance (green=简单, neutral=普通, red-orange=困难); `.pending` (a queued next-match switch)
         adds a dashed outline + the muted "下局→X" note. */
      #topbar .topbar-difficulty { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #9aa3c9; border: 1px solid transparent; }
      #topbar .topbar-difficulty b { font-size: 13px; font-weight: 600; }
      #topbar .topbar-difficulty.tier-easy { background: #16240f; color: #9ecb7e; border-color: #3a5a28; }
      #topbar .topbar-difficulty.tier-easy b { color: #c3e8a8; }
      #topbar .topbar-difficulty.tier-normal { background: #17182c; color: #9aa3c9; border-color: #34365a; }
      #topbar .topbar-difficulty.tier-normal b { color: #cfd4ea; }
      #topbar .topbar-difficulty.tier-hard { background: #2c1410; color: #ffab8a; border-color: #7a3a2a; }
      #topbar .topbar-difficulty.tier-hard b { color: #ffcbb3; }
      #topbar .topbar-difficulty.pending { border-style: dashed; border-color: #ffd76e; }
      #topbar .topbar-difficulty .pending-note { color: #ffd76e; font-size: 11px; }
      /* V4f-10 L2 (light command client, docs/plans/nightide/2026-07-21-light-command-design.md
         §3): 阵型 (stance) row — 集结/进攻/防守, same pill-button family as .difficulty-row above
         but placed near the top (goldRow tier, not tucked in ☰ 菜单) since a stance change is a
         mid-match action the player reaches for often, unlike difficulty (next-match only). No
         `.active` state is ever set from a click here — it's a pure read of the running match's
         `state.command[0].stance` (see `hud.ts`'s `stanceButtons` doc comment). */
      #hud .stance-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
      #hud .stance-label { color: #9aa3c9; font-size: 12px; margin-right: 2px; }
      #hud .stance-btn { flex: 1; padding: 5px 4px; font-size: 12px; text-align: center; background: #201a3a; color: #9aa3c9; border: 1px solid #3a3a5a; border-radius: 6px; }
      #hud .stance-btn:hover { background: #2a2248; }
      #hud .stance-btn.active { background: #2e2350; border-color: #7a5ad8; color: #e8dcff; }
      #hud .stance-btn:disabled { opacity: 0.35; cursor: default; }
      /* 「设集结点」 toggle — same placement-mode family as the building panel's own buttons, but its own warm
         gold/amber hue matching the on-board rally flag (`RALLY_FLAG_COLOR` in BattleScene.ts, the
         same hue as `.gold-row`/`OWN_HALF_TINT[0]`), so the button and the flag it controls read
         as the same feature. */
      #hud .rally-pick-btn { padding: 8px; background: #3a2e14; color: #ffcf6e; border: 1px solid #7a5a24; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; }
      #hud .rally-pick-btn:hover { background: #4a3a1c; }
      #hud .rally-pick-btn.active { background: #d8a03c; color: #1a1406; border-color: #ffd76e; }
      #hud .rally-pick-btn:disabled { opacity: 0.35; cursor: default; }
      /* Cursor hint while picking a rally cell — mirrors #game.ability-targeting's own rule. */
      #game.rally-picking canvas { cursor: crosshair; }
      /* M2d Task (天梯): "守夜人 1063" style rating readout + match-end delta line. HUD redesign v2:
         the persistent rating readout moved to topbar row 1「整体」; the match-end delta stays in `#hud`. */
      #topbar .ladder-row { font-size: 13px; color: #ffd76e; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
      #hud .ladder-delta-row { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; text-align: center; }
      #hud .ladder-delta-row.positive { color: #7ce0a0; background: #16281c; }
      #hud .ladder-delta-row.negative { color: #ff8a8a; background: #2a1414; }
      /* M2d Task (托管): "守灯人代打中…" badge, shown while the steward is in control. */
      #hud .takeover-badge { font-size: 12px; color: #ffd76e; background: #2a2210; border: 1px solid #7a6a34; border-radius: 6px; padding: 5px 8px; text-align: center; }
      /* V2e hero abilities (M2e-3 client): 灯辉 energy bar — a glowing worldview-toned meter. HUD
         redesign v2 (user feedback: put 灯辉 next to the abilities): moved out of `#topbar` to the
         bottom of `#hud`, directly above the ability bar, so the player watches the meter fill right
         where the cast buttons are. Fills the full 200px `#hud` column (`flex: 1` track). */
      #hud .lamplight-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ffd76e; }
      #hud .lamplight-label { flex-shrink: 0; font-weight: 600; letter-spacing: 1px; }
      #hud .lamplight-track { flex: 1; height: 8px; background: #241a08; border: 1px solid #7a6a34; border-radius: 4px; overflow: hidden; }
      #hud .lamplight-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d8a03c, #ffe38a); box-shadow: 0 0 8px rgba(255, 215, 110, 0.75); transition: width 0.15s linear; }
      #hud .lamplight-value { flex-shrink: 0; font-variant-numeric: tabular-nums; color: #cfd4ea; }
      /* V2e hero abilities (M2e-3 client): the hero ability bar — a distinct glowing "ready" state
         once affordable (lamplight[0] >= cost), dimmed otherwise; `.targeting` marks the ability
         currently awaiting a board click. */
      #hud .abilities-row { display: flex; flex-direction: column; gap: 6px; }
      #hud .ability-btn { padding: 8px; background: #201a3a; color: #7a7fa0; border: 1px solid #3a3a5a; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; opacity: 0.55; }
      #hud .ability-btn.ready { opacity: 1; color: #ffd76e; border-color: #ffd76e; box-shadow: 0 0 8px rgba(255, 215, 110, 0.5); }
      #hud .ability-btn.ready:hover { background: #2a2248; }
      #hud .ability-btn.targeting { border-color: #ffe38a; border-style: dashed; color: #ffe38a; background: #2e2a12; }
      #hud .ability-btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
      #hud .ability-btn.shake { animation: card-shake 0.3s ease-in-out; }
      /* V2e hero abilities (M2e-3 client): cursor hint while a target-required ability awaits its
         placement cell — mirrors the pattern the pause overlay already established for #game. */
      #game.ability-targeting canvas { cursor: crosshair; }
      #nightide-tooltip { position: fixed; z-index: 1000; pointer-events: none; background: #17123a; border: 1px solid #4a3a7a; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #cfd4ea; max-width: 260px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }
      #nightide-tooltip .tt-title { font-weight: 600; color: #ffcf6e; margin-bottom: 2px; }
      #nightide-tooltip .tt-desc { color: #9aa3c9; margin-bottom: 4px; }
      #nightide-tooltip .tt-upgrade-title { color: #d8a03c; margin-top: 6px; font-weight: 600; }
      /* Barracks tooltip reorder (statFormat.ts's HeaderLine): visually identical to
         .tt-upgrade-title (same amber/weight/spacing) but a separate class — this one names the
         produced-unit stat block that now leads a barracks card's tooltip, a different semantic
         role than an upgrade-preview title even though they should look the same today. */
      #nightide-tooltip .tt-subhead { color: #d8a03c; margin-top: 6px; font-weight: 600; }
      @keyframes card-shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(3px); }
        30%, 50%, 70% { transform: translateX(-5px); }
        40%, 60% { transform: translateX(5px); }
      }
      @keyframes toast-float {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-18px); }
      }
      /* M2c 潮汐警报 / V4g-E3 (night-tide event banners): a single shared banner overlaid on the
         battlefield (#game) for BOTH tideWarning ("夜潮将至！") and the 3 nightEvent kinds — see
         ui/tideAlert.ts's TideAlert + nightEventBanner.ts's copy/class lookup. Color/text-shadow
         live on the per-kind `.kind-*` class (not this base rule) so each event reads distinctly;
         fade-in/out timing/shape is shared via the same `tide-banner-fade` animation. */
      #nightide-tide-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 800; letter-spacing: 3px; pointer-events: none; opacity: 0; z-index: 15; white-space: nowrap; }
      #nightide-tide-banner.tide-banner-show { animation: tide-banner-fade 2s ease-in-out; }
      /* tideWarning: the pre-existing dark-red treatment, unchanged. */
      #nightide-tide-banner.kind-tideWarning { color: #ff3344; text-shadow: 0 0 18px rgba(255, 51, 68, 0.85), 0 2px 4px #1a0006; }
      /* beastSurge: cool cyan-blue, echoing WILD_TINT (BattleScene.ts) — "the tide itself surges". */
      #nightide-tide-banner.kind-beastSurge { color: #35c9ff; text-shadow: 0 0 18px rgba(53, 201, 255, 0.85), 0 2px 4px #04121a; }
      /* quake: earthy fire-orange, echoing the forest-fire sweep fx's palette (effects.ts) — "the
         ground itself is splitting". */
      #nightide-tide-banner.kind-quake { color: #ff8a3d; text-shadow: 0 0 18px rgba(255, 138, 61, 0.85), 0 2px 4px #1a0e04; }
      /* direSurge: the most ominous of the three (task brief) — larger, a deeper blood-red/violet,
         and a slower, heavier pulse on top of the shared fade so it reads as genuinely dreadful
         rather than merely "another banner". */
      #nightide-tide-banner.kind-direSurge { font-size: 40px; letter-spacing: 5px; color: #ff2a55; text-shadow: 0 0 26px rgba(255, 20, 60, 0.95), 0 0 44px rgba(120, 0, 40, 0.7), 0 2px 6px #0a0004; }
      #nightide-tide-banner.kind-direSurge.tide-banner-show { animation: tide-banner-fade 2s ease-in-out, dire-banner-pulse 0.5s ease-in-out 3; }
      @keyframes tide-banner-fade {
        0% { opacity: 0; transform: translate(-50%, -62%); }
        15% { opacity: 1; transform: translate(-50%, -50%); }
        80% { opacity: 1; transform: translate(-50%, -50%); }
        100% { opacity: 0; transform: translate(-50%, -44%); }
      }
      @keyframes dire-banner-pulse {
        0%, 100% { text-shadow: 0 0 26px rgba(255, 20, 60, 0.95), 0 0 44px rgba(120, 0, 40, 0.7), 0 2px 6px #0a0004; }
        50% { text-shadow: 0 0 40px rgba(255, 20, 60, 1), 0 0 70px rgba(120, 0, 40, 0.9), 0 2px 6px #0a0004; }
      }
      /* Pause overlay (single-player pause feature — see ui/pauseOverlay.ts): subtle dark overlay
         over the battlefield while paused. `pointer-events: none` is load-bearing — the canvas's
         own hover tooltip must keep working THROUGH this overlay while paused (task brief:
         "inspecting the battlefield while paused is a feature with the codex"). */
      #nightide-pause-overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(6, 7, 15, 0.55); pointer-events: none; z-index: 16; text-align: center; }
      #nightide-pause-overlay.show { display: flex; }
      #nightide-pause-overlay .pause-title { font-size: 30px; font-weight: 800; letter-spacing: 4px; color: #dfe4f7; text-shadow: 0 0 14px rgba(159, 211, 255, 0.5), 0 2px 4px #000; }
      #nightide-pause-overlay .pause-subtitle { margin-top: 8px; font-size: 13px; color: #8a93b9; letter-spacing: 1px; }
      /* HUD 改版：抽卡居中暂停弹窗（docs/plans/nightide/2026-07-23-hud-draft-modal-card-grid-design.md
         第一节）。遮罩即输入屏障 —— menu/暂停/投降全在下面，modal 打开期间唯一可点的就是三张卡。 */
      #draft-modal-overlay { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; background: rgba(6, 4, 16, 0.65); }
      #draft-modal-overlay .draft-modal-panel { background: #17123a; border: 1px solid #4a3a7a; border-radius: 10px; padding: 16px 18px; width: min(92vw, 560px); box-shadow: 0 0 40px rgba(0, 0, 0, 0.8); }
      #draft-modal-overlay .draft-modal-panel.pop { animation: draft-pop 0.25s ease-out; }
      @keyframes draft-pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      #draft-modal-overlay .draft-modal-title { font-size: 16px; font-weight: 600; color: #ffd76e; text-align: center; margin-bottom: 12px; }
      #draft-modal-overlay .draft-modal-cards { display: flex; gap: 10px; align-items: stretch; }
      #draft-modal-overlay .draft-modal-card { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px; background: #1a1633; border: 1px solid #4a3a7a; border-radius: 8px; cursor: pointer; color: #cfd4ea; }
      #draft-modal-overlay .draft-modal-card:hover { border-color: #ffd76e; box-shadow: 0 0 8px rgba(255, 215, 110, 0.35); }
      #draft-modal-overlay .draft-modal-card img { width: 56px; height: 56px; object-fit: contain; }
      #draft-modal-overlay .draft-modal-name { font-size: 13px; font-weight: 600; }
      #draft-modal-overlay .draft-modal-cost { font-size: 11px; color: #e8d9a0; }
      #draft-modal-overlay .draft-modal-detail { font-size: 10px; color: #9aa3c9; line-height: 1.5; text-align: left; }
      /* 倒计时条：2026-07-23 起是墙钟实时倒计时（用户反馈「抽卡暂停也要有时间限制」）——modal 打开
         期间即使 sim 侧暂停冻着 tick，这条 width 仍由 draftModal.ts 的 performance.now() 计时器
         每 ~100ms 实时收窄，到点自动选 index 0 并关闭 modal（CSS 数值不变，仅注释更新）。 */
      #draft-modal-overlay .draft-modal-bar { height: 4px; background: #241a3a; border-radius: 2px; margin-top: 12px; overflow: hidden; }
      #draft-modal-overlay .draft-modal-bar-fill { height: 100%; width: 100%; background: #d8a03c; }
      /* 新手帮助卡（help-overlay spec）——DraftModal 同款视觉族，z-index 890 见 helpOverlay.ts 注释。
         这是 BLOCKING 模态的默认外观（手动从 ☰ 菜单「怎么玩」重看时用这套）——遮罩即输入屏障。 */
      #help-overlay { position: fixed; inset: 0; z-index: 890; display: flex; align-items: center; justify-content: center; background: rgba(6, 4, 16, 0.72); }
      #help-overlay .help-panel { position: relative; background: #17123a; border: 1px solid #4a3a7a; border-radius: 10px; padding: 18px 20px; width: min(92vw, 460px); max-height: 88vh; overflow-y: auto; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8); }
      #help-overlay .help-title { font-size: 17px; font-weight: 700; color: #ffd76e; text-align: center; margin-bottom: 14px; }
      #help-overlay .help-step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
      #help-overlay .help-step img { width: 40px; height: 40px; object-fit: contain; flex: none; }
      #help-overlay .help-step-title { font-size: 13px; font-weight: 600; color: #e8d9a0; }
      #help-overlay .help-step-body { font-size: 12px; color: #9aa3c9; line-height: 1.6; }
      #help-overlay .help-go-btn { display: block; margin: 14px auto 0; padding: 8px 26px; font-size: 14px; font-weight: 600; }
      #help-overlay .help-close-btn { position: absolute; top: 8px; right: 10px; background: none; border: none; color: #7c86ad; font-size: 14px; cursor: pointer; }
      /* fix (CrazyGames rejection, "整体质量不达标" — 首次进入需要点 2 次才可玩，超出 CrazyGames
         Gameplay requirements 的"最多 1 次"硬性上限): 首次自动弹改走这套非阻塞 toast 外观
         （`HelpOverlay.show(false)` 加的 `.help-overlay-toast` class，见 helpOverlay.ts 顶部
         doc comment）——容器整体 `pointer-events: none`，不再有全屏背景遮罩，挪到视口左下角；只有
         卡片本体 `pointer-events: auto`，玩家选完模式后可以直接点棋盘/卡牌，完全不受这张卡拦截。 */
      #help-overlay.help-overlay-toast { align-items: flex-end; justify-content: flex-start; background: transparent; padding: 16px; pointer-events: none; }
      #help-overlay.help-overlay-toast .help-panel { pointer-events: auto; width: min(84vw, 300px); max-height: 46vh; border-color: #6a52b8; box-shadow: 0 6px 28px rgba(0, 0, 0, 0.55); }
      /* Brief CSS shake on the #game WRAPPER only (render-only, never the Phaser canvas's own
         transform — see ui/tideAlert.ts's doc comment). */
      #game.tide-shake { animation: tide-wrapper-shake 0.4s ease-in-out; }
      @keyframes tide-wrapper-shake {
        10%, 90% { transform: translateX(-3px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-7px); }
        40%, 60% { transform: translateX(7px); }
      }
      /* M2d Task (投降与托管): the 3-option surrender modal (see ui/surrenderDialog.ts) — overlaid
         on #game, clickable (unlike the pause overlay, this one is NOT pointer-events: none). */
      #nightide-surrender-dialog { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 7, 15, 0.7); z-index: 20; }
      #nightide-surrender-dialog.show { display: flex; }
      #nightide-surrender-dialog .surrender-box { display: flex; flex-direction: column; gap: 8px; background: #17123a; border: 1px solid #4a3a7a; border-radius: 8px; padding: 18px 22px; min-width: 220px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }
      #nightide-surrender-dialog .surrender-title { font-size: 18px; font-weight: 700; color: #dfe4f7; text-align: center; margin-bottom: 6px; }
      #nightide-surrender-dialog .surrender-opt { padding: 9px; background: #241a3a; color: #cfd4ea; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; }
      #nightide-surrender-dialog .surrender-opt:hover { background: #2e2350; }
      #nightide-surrender-dialog .surrender-concede { color: #ffb3b3; border-color: #7a3a3a; }
      #nightide-surrender-dialog .surrender-cancel { color: #9aa3c9; }
      /* M2d Task (战史): the match-history overlay panel (see ui/historyPanel.ts) — attached to
         <body>, covers the whole page (not just #game). */
      #nightide-history-panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 7, 15, 0.75); z-index: 30; }
      #nightide-history-panel.show { display: flex; }
      #nightide-history-panel .history-box { display: flex; flex-direction: column; gap: 10px; background: #12101f; border: 1px solid #4a3a7a; border-radius: 8px; padding: 16px 20px; width: min(640px, 92vw); max-height: 80vh; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55); }
      #nightide-history-panel .history-header { display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700; color: #ffcf6e; }
      #nightide-history-panel .history-close { padding: 6px 12px; background: #241a3a; color: #cfd4ea; border: 1px solid #4a3a7a; border-radius: 6px; cursor: pointer; font-size: 13px; }
      #nightide-history-panel .history-close:hover { background: #2e2350; }
      #nightide-history-panel .history-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
      #nightide-history-panel .history-empty { padding: 24px; text-align: center; color: #6b7396; font-size: 14px; }
      #nightide-history-panel .history-row { display: grid; grid-template-columns: 78px 24px 1fr 40px 52px 46px 56px 1fr; gap: 8px; align-items: center; padding: 6px 8px; background: #191530; border-radius: 6px; font-size: 12px; color: #cfd4ea; }
      #nightide-history-panel .history-date { color: #8a93b9; }
      #nightide-history-panel .history-result { font-weight: 700; text-align: center; }
      #nightide-history-panel .history-result-win .history-result { color: #7ce0a0; }
      #nightide-history-panel .history-result-loss .history-result { color: #ff8a8a; }
      #nightide-history-panel .history-result-draw .history-result { color: #9aa3c9; }
      /* B2 (client difficulty UI): per-row difficulty tag (简单/普通/困难/— for pre-B2 entries with
         no recorded tier — see `historyStore.ts`'s `HistoryEntry.difficulty` doc comment). */
      #nightide-history-panel .history-difficulty { text-align: center; font-weight: 600; }
      #nightide-history-panel .history-difficulty-easy { color: #7ce0a0; }
      #nightide-history-panel .history-difficulty-normal { color: #9fd3ff; }
      #nightide-history-panel .history-difficulty-hard { color: #ff8a8a; }
